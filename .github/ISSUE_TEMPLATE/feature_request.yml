name: Feature request
description: Propose a bounded user-visible improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator problem, not just a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and acceptance check
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [ingest, queueing, notifications, CLI, dashboard, integration adapter, operations, documentation]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Do not include credentials, ledger/spool content, session transcripts, or unredacted machine paths."
